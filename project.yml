name: TreeID
options:
  bundleIdPrefix: com.robertvolk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

schemes:
  TreeID:
    build:
      targets:
        TreeID: all
    run:
      config: Release
    archive:
      config: Release

targets:
  TreeID:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      # Optional: drop a TreeSpecies.mlmodel in here for fully offline species ID.
      - path: Resources/Models
        optional: true
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/AppIcons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertvolk.treeid
        PRODUCT_NAME: TreeID
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: "NO"
